apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: financial-platform
spec:
  replicas: 1
  selector: {matchLabels: {app: postgres}}
  template:
    metadata: {labels: {app: postgres}}
    spec:
      containers:
      - name: postgres
        image: postgres:16
        env:
        - {name: POSTGRES_DB, value: financial_enrollment}
        - {name: POSTGRES_USER, value: financial_user}
        - {name: POSTGRES_PASSWORD, value: financial_pass}
        ports: [{containerPort: 5432}]
        volumeMounts:
        - {name: data, mountPath: /var/lib/postgresql/data}
        - {name: init, mountPath: /docker-entrypoint-initdb.d/01-init.sql, subPath: init.sql}
      volumes:
      - {name: data, emptyDir: {}}
      - {name: init, configMap: {name: postgres-init}}
---
apiVersion: v1
kind: Service
metadata: {name: postgres, namespace: financial-platform}
spec:
  selector: {app: postgres}
  ports: [{port: 5432, targetPort: 5432}]
