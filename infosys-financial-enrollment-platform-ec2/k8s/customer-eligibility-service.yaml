apiVersion: apps/v1
kind: Deployment
metadata: {name: customer-eligibility-service, namespace: financial-platform}
spec:
  replicas: 1
  selector: {matchLabels: {app: customer-eligibility-service}}
  template:
    metadata: {labels: {app: customer-eligibility-service}}
    spec:
      containers:
      - name: customer-eligibility-service
        image: REPLACE_ECR_IMAGE/customer-eligibility-service:1.0.0
        ports: [{containerPort: 8083}]
        env:
        - name: SERVER_PORT
          value: "8083"
        - name: VALIDATION_URL
          value: http://data-validation-service:8082
        - name: ELIGIBILITY_URL
          value: http://customer-eligibility-service:8083
        - name: SEGMENTATION_URL
          value: http://account-segmentation-service:8084
        - name: ENROLLMENT_URL
          value: http://enrollment-service:8085
        - name: TRANSFORMATION_URL
          value: http://data-transformation-service:8086
        - name: NOTIFICATION_URL
          value: http://transaction-notification-service:8087
---
apiVersion: v1
kind: Service
metadata: {name: customer-eligibility-service, namespace: financial-platform}
spec:
  selector: {app: customer-eligibility-service}
  ports: [{port: 8083, targetPort: 8083}]
